<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#a6e3a1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#181825" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#11111b" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a2b" />
      <stop offset="100%" stop-color="#0f241a" />
    </linearGradient>
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45475a" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGlow)" />

  <!-- Floating 8-bit Pixel Decor -->
  <g fill="#a6e3a1" opacity="0.3">
    <!-- Pixel Heart (Top Left) -->
    <path d="M 90 80 h 8 v -8 h 8 v -8 h 8 v 8 h 8 v 8 h 8 v 16 h -8 v 8 h -8 v 8 h -8 v 8 h -8 v -8 h -8 v -8 h -8 v -8 h -8 v -16 h 8 v -8 h 8 Z" fill="#f38ba8" opacity="0.75" />
    <!-- Floating Pixel Coins / Stars -->
    <rect x="520" y="70" width="10" height="10" rx="2" fill="#f9e2af" opacity="0.8" />
    <rect x="540" y="90" width="6" height="6" rx="1" fill="#f9e2af" opacity="0.6" />
    <rect x="110" y="240" width="8" height="8" rx="2" fill="#a6e3a1" opacity="0.6" />
    <rect x="510" y="250" width="12" height="12" rx="2" fill="#89b4fa" opacity="0.5" />
  </g>

  <!-- Handheld Console Chassis -->
  <g transform="translate(180, 24)" filter="url(#shadow)">
    <!-- Main Ergonomic Body -->
    <rect x="0" y="0" width="280" height="312" rx="28" fill="url(#bodyGrad)" stroke="#45475a" stroke-width="2" />
    <!-- Top Edge Highlight -->
    <path d="M 28 2 L 252 2" stroke="#585b70" stroke-width="1.5" stroke-linecap="round" />

    <!-- Screen Bezel -->
    <rect x="22" y="22" width="236" height="150" rx="14" fill="#181825" stroke="#313244" stroke-width="1.5" />
    <!-- Power LED -->
    <circle cx="40" cy="36" r="3" fill="#a6e3a1" filter="url(#screenGlow)" />
    <!-- Brand / Model Logo -->
    <text x="140" y="164" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#6c7086" letter-spacing="2" text-anchor="middle">PORTMASTER · 60 FPS</text>

    <!-- Glowing LCD Display Screen -->
    <g transform="translate(42, 36)" filter="url(#screenGlow)">
      <rect x="0" y="0" width="196" height="114" rx="6" fill="url(#screenGrad)" stroke="#2b593f" stroke-width="1" />
      
      <!-- Retro 8-bit Landscape Art -->
      <!-- Moon / Sun -->
      <circle cx="160" cy="30" r="14" fill="#f9e2af" opacity="0.9" />
      <circle cx="164" cy="28" r="12" fill="#1e3a2b" />
      
      <!-- 8-Bit Clouds -->
      <path d="M 30 25 h 30 v 6 h -30 Z M 38 19 h 16 v 6 h -16 Z" fill="#a6e3a1" opacity="0.4" />
      <path d="M 90 38 h 26 v 5 h -26 Z M 96 33 h 14 v 5 h -14 Z" fill="#a6e3a1" opacity="0.3" />

      <!-- Mountain Silhouettes -->
      <polygon points="10,114 60,54 110,114" fill="#154029" />
      <polygon points="80,114 130,42 180,114" fill="#1c5436" />
      <polygon points="120,42 130,42 135,52 125,56" fill="#a6e3a1" opacity="0.8" />
      
      <!-- Ground Grid Lines -->
      <line x1="0" y1="104" x2="196" y2="104" stroke="#a6e3a1" stroke-width="1" opacity="0.6" />
      <line x1="0" y1="110" x2="196" y2="110" stroke="#a6e3a1" stroke-width="1.5" opacity="0.8" />
      
      <!-- Player Sprite (Tiny 8-bit Hero) -->
      <rect x="44" y="90" width="8" height="14" fill="#f38ba8" />
      <rect x="46" y="92" width="6" height="4" fill="#f9e2af" />
    </g>

    <!-- Controls Arena (Bottom Section) -->
    <!-- Directional D-Pad (Left) -->
    <g transform="translate(64, 218)" filter="url(#shadow)">
      <!-- Outer Cross -->
      <path d="M -10 -28 h 20 v 18 h 18 v 20 h -18 v 18 h -20 v -18 h -18 v -20 h 18 Z" fill="url(#dpadGrad)" stroke="#313244" stroke-width="1.5" rx="3" />
      <!-- Center Pivot Dimple -->
      <circle cx="0" cy="0" r="4.5" fill="#181825" />
      <!-- Directional Arrow Notches -->
      <polygon points="0,-22 -3,-18 3,-18" fill="#6c7086" />
      <polygon points="0,22 -3,18 3,18" fill="#6c7086" />
      <polygon points="-22,0 -18,-3 -18,3" fill="#6c7086" />
      <polygon points="22,0 18,-3 18,3" fill="#6c7086" />
    </g>

    <!-- Action Buttons (Right) in classic diamond angle -->
    <g transform="translate(216, 218)">
      <!-- B Button -->
      <g transform="translate(-16, 10)">
        <circle cx="0" cy="0" r="13" fill="#f38ba8" stroke="#313244" stroke-width="1.5" />
        <circle cx="-2" cy="-2" r="10" fill="#f38ba8" opacity="0.8" />
        <text x="0" y="4.5" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="800" fill="#11111b" text-anchor="middle">B</text>
      </g>
      <!-- A Button -->
      <g transform="translate(16, -10)">
        <circle cx="0" cy="0" r="13" fill="#a6e3a1" stroke="#313244" stroke-width="1.5" />
        <circle cx="-2" cy="-2" r="10" fill="#a6e3a1" opacity="0.8" />
        <text x="0" y="4.5" font-family="'Bricolage Grotesque', sans-serif" font-size="11" font-weight="800" fill="#11111b" text-anchor="middle">A</text>
      </g>
    </g>

    <!-- Start / Select Pill Buttons (Center Bottom) -->
    <g transform="translate(140, 276)">
      <rect x="-24" y="0" width="18" height="6" rx="3" fill="#45475a" transform="rotate(-25 -15 3)" />
      <rect x="6" y="0" width="18" height="6" rx="3" fill="#45475a" transform="rotate(-25 15 3)" />
      <text x="-15" y="16" font-family="'JetBrains Mono', monospace" font-size="6" fill="#6c7086" text-anchor="middle">SELECT</text>
      <text x="15" y="16" font-family="'JetBrains Mono', monospace" font-size="6" fill="#6c7086" text-anchor="middle">START</text>
    </g>

    <!-- Speaker Grill (Bottom Right) -->
    <g transform="translate(230, 276)" fill="#181825">
      <circle cx="0" cy="0" r="1.8" /><circle cx="7" cy="0" r="1.8" /><circle cx="14" cy="0" r="1.8" />
      <circle cx="3.5" cy="5" r="1.8" /><circle cx="10.5" cy="5" r="1.8" />
      <circle cx="7" cy="10" r="1.8" />
    </g>
  </g>
</svg>
