<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#181825" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#11111b" />
    </radialGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#89b4fa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="faceplateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c2e7" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>
    <linearGradient id="freqCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38ba8" />
      <stop offset="35%" stop-color="#cba6f7" />
      <stop offset="70%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="audioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGlow)" />

  <!-- Acoustic Frequency Grid (20Hz - 20kHz logarithmic grid) -->
  <g opacity="0.12" stroke="#cdd6f4" stroke-width="1">
    <!-- Vertical frequency decade lines -->
    <line x1="80" y1="40" x2="80" y2="320" />
    <line x1="180" y1="40" x2="180" y2="320" />
    <line x1="320" y1="40" x2="320" y2="320" />
    <line x1="460" y1="40" x2="460" y2="320" />
    <line x1="560" y1="40" x2="560" y2="320" />
    <!-- Horizontal dB target lines -->
    <line x1="60" y1="120" x2="580" y2="120" stroke-dasharray="4,6" />
    <line x1="60" y1="180" x2="580" y2="180" stroke-dasharray="4,6" />
    <line x1="60" y1="240" x2="580" y2="240" stroke-dasharray="4,6" />
  </g>

  <!-- Frequency Grid Legend -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#6c7086" opacity="0.7">
    <text x="80" y="338" text-anchor="middle">20 Hz</text>
    <text x="180" y="338" text-anchor="middle">100 Hz</text>
    <text x="320" y="338" text-anchor="middle">1 kHz</text>
    <text x="460" y="338" text-anchor="middle">8 kHz</text>
    <text x="560" y="338" text-anchor="middle">20 kHz</text>
    <text x="50" y="123" text-anchor="end">+10 dB</text>
    <text x="50" y="183" text-anchor="end">0 dB</text>
    <text x="50" y="243" text-anchor="end">-10 dB</text>
  </g>

  <!-- Sweeping Harman Target Frequency Curve -->
  <path d="M 60 145 C 130 140, 180 185, 260 190 C 340 195, 380 135, 430 115 C 470 100, 500 170, 540 160 C 560 155, 580 195, 600 210" 
        fill="none" stroke="url(#freqCurve)" stroke-width="3" stroke-linecap="round" filter="url(#audioGlow)" />
  
  <!-- Target Curve Label -->
  <text x="440" y="98" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#cba6f7" letter-spacing="1">HARMAN 2019v2</text>

  <!-- Central IEM Earpiece Graphic -->
  <g transform="translate(230, 48)" filter="url(#shadow)">
    <!-- Over-Ear Braided Silver Cable -->
    <path d="M 95 38 C 95 -10, 40 -15, 20 20 C 5 50, -5 120, -15 180" fill="none" stroke="#bac2de" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 95 38 C 95 -10, 40 -15, 20 20 C 5 50, -5 120, -15 180" fill="none" stroke="#f5e0dc" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round" opacity="0.9" />

    <!-- MMCX Gold Connector -->
    <rect x="88" y="32" width="14" height="22" rx="3" fill="#f9e2af" stroke="#313244" stroke-width="1.5" />
    <circle cx="95" cy="43" r="2.5" fill="#fab387" />

    <!-- Ergonomic Custom Resin Shell -->
    <path d="M 95 50 C 135 60, 175 100, 160 160 C 150 200, 110 220, 65 210 C 25 200, 10 150, 20 100 C 25 70, 60 45, 95 50 Z" 
          fill="url(#shellGrad)" stroke="#cba6f7" stroke-width="2" />

    <!-- Internal Driver Components (Visible Through Resin) -->
    <!-- Dynamic Driver (Bass/Mid Woofer) -->
    <circle cx="75" cy="145" r="26" fill="#181825" stroke="#89b4fa" stroke-width="1.8" />
    <circle cx="75" cy="145" r="16" fill="#313244" stroke="#cba6f7" stroke-width="1.2" />
    <circle cx="75" cy="145" r="8" fill="#f9e2af" opacity="0.85" />
    <!-- Balanced Armature (Treble Tweeter) -->
    <rect x="105" y="115" width="22" height="15" rx="3" fill="#313244" stroke="#fab387" stroke-width="1.5" />
    <line x1="127" y1="122" x2="138" y2="128" stroke="#fab387" stroke-width="1.5" />

    <!-- Acoustic Sound Bore / Nozzle -->
    <g transform="translate(135, 175) rotate(28)">
      <rect x="0" y="0" width="28" height="22" rx="3" fill="#313244" stroke="#585b70" stroke-width="1.5" />
      <!-- Metal Mesh Filter Lip -->
      <rect x="24" y="-2" width="6" height="26" rx="2" fill="#f9e2af" stroke="#45475a" stroke-width="1" />
      <line x1="27" y1="2" x2="27" y2="20" stroke="#181825" stroke-width="1" stroke-dasharray="1.5,1.5" />
    </g>

    <!-- Swirling Artistic Faceplate Shell Accent -->
    <path d="M 85 58 C 115 65, 145 95, 135 140 C 120 120, 100 110, 70 115 C 50 85, 65 65, 85 58 Z" 
          fill="url(#faceplateGrad)" opacity="0.85" filter="url(#audioGlow)" />
  </g>

  <!-- Pulsing Soundwave Rings -->
  <g stroke="#cba6f7" stroke-width="1.5" fill="none" opacity="0.35" filter="url(#audioGlow)">
    <circle cx="395" cy="245" r="15" stroke-dasharray="5,3" />
    <circle cx="395" cy="245" r="30" stroke-dasharray="6,4" />
    <circle cx="395" cy="245" r="48" stroke-dasharray="8,6" opacity="0.2" />
  </g>
</svg>
